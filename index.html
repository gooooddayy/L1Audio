<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L1音频工具箱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0f2f5;
      --nav-bg: #ffffff;
      --nav-border: #e8eaed;
      --text: #1f2329;
      --text-2: #6b7280;
      --text-3: #9ca3af;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --primary-bg: #eef2ff;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --radius: 16px;
      --nav-h: 60px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== Nav Bar ===== */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--nav-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 9999;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .nav-brand svg { width: 32px; height: 32px; }

    .nav-brand .brand-text {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .nav-btn.home-btn {
      color: var(--text-2);
    }

    .nav-btn.home-btn.active {
      background: var(--primary-bg);
      color: var(--primary);
    }

    /* ===== Home View ===== */
    .home-view {
      padding-top: var(--nav-h);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + 40px) 24px 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-2);
      max-width: 480px;
      line-height: 1.6;
    }

    /* ===== Tool Cards Grid ===== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 880px;
      width: 100%;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--card-accent, var(--primary));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .25s ease;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--card-accent, var(--primary));
    }

    .tool-card:hover::before {
      transform: scaleX(1);
    }

    .tool-card .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      background: var(--card-icon-bg, var(--primary-bg));
    }

    .tool-card .card-icon svg {
      width: 24px;
      height: 24px;
    }

    .tool-card h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .tool-card p {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
    }

    .tool-card .card-arrow {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--card-accent, var(--primary));
      transition: gap .2s ease;
    }

    .tool-card:hover .card-arrow {
      gap: 10px;
    }

    /* ===== Tool View (iframe) ===== */
    .tool-view {
      display: none;
      padding-top: var(--nav-h);
      width: 100%;
      height: 100vh;
    }

    .tool-view.active {
      display: block;
    }

    .tool-view iframe {
      width: 100%;
      height: calc(100vh - var(--nav-h));
      border: none;
      display: block;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .navbar { padding: 0 12px; }
      .nav-brand .brand-text { display: none; }
      .nav-btn { padding: 7px 10px; font-size: 13px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 14px; }
      .tools-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="nav-brand" onclick="showView('home')">
      <!-- L1 Box Icon -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Box top face -->
        <path d="M24 4 L42 13 L24 22 L6 13 Z" fill="#6366f1"/>
        <!-- Box left face -->
        <path d="M6 13 L24 22 L24 44 L6 35 Z" fill="#4f46e5"/>
        <!-- Box right face -->
        <path d="M42 13 L24 22 L24 44 L42 35 Z" fill="#5b54ec"/>
        <!-- L1 text on front face -->
        <text x="15" y="38" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="0.5">L1</text>
      </svg>
      <span class="brand-text">L1音频工具箱</span>
    </div>

    <div class="nav-links">
      <button class="nav-btn home-btn active" data-view="home" onclick="showView('home')">首页</button>
      <button class="nav-btn" data-view="analysis" onclick="showView('analysis')">音频分析</button>
      <button class="nav-btn" data-view="enhance" onclick="showView('enhance')">音频增强</button>
      <button class="nav-btn" data-view="lyrics" onclick="showView('lyrics')">歌词转换</button>
      <button class="nav-btn" data-view="editor" onclick="showView('editor')">音频编辑</button>
    </div>
  </nav>

  <!-- ===== Home View ===== -->
  <div class="home-view" id="view-home">

    <div class="hero">
      <!-- Large L1 Box Icon -->
      <svg class="hero-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#6366f1"/>
          </linearGradient>
          <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#4338ca"/>
          </linearGradient>
          <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5b54ec"/>
            <stop offset="100%" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
        <path d="M24 4 L42 13 L24 22 L6 13 Z" fill="url(#topGrad)"/>
        <path d="M6 13 L24 22 L24 44 L6 35 Z" fill="url(#leftGrad)"/>
        <path d="M42 13 L24 22 L24 44 L42 35 Z" fill="url(#rightGrad)"/>
        <text x="14" y="39" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">L1</text>
      </svg>
      <h1>L1音频工具箱</h1>
      <p>一站式音频处理工具集 — 分析、增强、歌词转换、编辑，全部本地运行，无需联网</p>
    </div>

    <div class="tools-grid">
      <!-- 音频分析 -->
      <div class="tool-card" style="--card-accent:#22c55e;--card-icon-bg:rgba(34,197,94,.1)" onclick="showView('analysis')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <h3>音频质量分析</h3>
        <p>分析音频文件的格式、采样率、频谱、动态范围，检测假无损与过采样</p>
        <div class="card-arrow">
          进入工具
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>

      <!-- 音频增强 -->
      <div class="tool-card" style="--card-accent:#2563eb;--card-icon-bg:rgba(37,99,235,.1)" onclick="showView('enhance')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </div>
        <h3>音频增强器</h3>
        <p>提升音频音质，支持多种增强模式与输出格式转换</p>
        <div class="card-arrow">
          进入工具
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>

      <!-- 歌词精度转换 -->
      <div class="tool-card" style="--card-accent:#8b5cf6;--card-icon-bg:rgba(139,92,246,.1)" onclick="showView('lyrics')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"/>
            <line x1="9" y1="20" x2="15" y2="20"/>
            <line x1="12" y1="4" x2="12" y2="20"/>
          </svg>
        </div>
        <h3>歌词精度转换</h3>
        <p>LRC 歌词时间戳在 2 位与 3 位毫秒精度间互转，支持实时转换与导出</p>
        <div class="card-arrow">
          进入工具
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>

      <!-- 音频编辑 -->
      <div class="tool-card" style="--card-accent:#3370ff;--card-icon-bg:rgba(51,112,255,.1)" onclick="showView('editor')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3370ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <h3>音频分割编辑</h3>
        <p>可视化波形编辑 — 分割、淡入淡出、删除片段、变速播放、导出 WAV</p>
        <div class="card-arrow">
          进入工具
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Tool Views (iframes) ===== -->
  <div class="tool-view" id="view-analysis">
    <iframe src="音频分析.html"></iframe>
  </div>
  <div class="tool-view" id="view-enhance">
    <iframe src="音频增强.html"></iframe>
  </div>
  <div class="tool-view" id="view-lyrics">
    <iframe src="歌词精度转换.html"></iframe>
  </div>
  <div class="tool-view" id="view-editor">
    <iframe src="音频编辑.html"></iframe>
  </div>

  <script>
    function showView(view) {
      // Hide all views
      document.querySelectorAll('.home-view, .tool-view').forEach(el => {
        el.classList.remove('active');
        el.style.display = 'none';
      });

      // Show selected view
      const target = document.getElementById('view-' + view);
      if (target) {
        if (view === 'home') {
          target.style.display = 'flex';
        } else {
          target.style.display = 'block';
          target.classList.add('active');
        }
      }

      // Update nav button states
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

      // Scroll to top
      window.scrollTo(0, 0);
    }

    // Initialize
    showView('home');
  </script>

</body>
</html>

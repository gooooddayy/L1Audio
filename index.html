<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L1音频工具箱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0f2f5;
      --nav-bg: #ffffff;
      --nav-border: #e8eaed;
      --text: #1f2329;
      --text-2: #6b7280;
      --text-3: #9ca3af;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --primary-bg: #eef2ff;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --radius: 16px;
      --nav-h: 60px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== Floating Toolbar ===== */
    .toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--nav-border);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      z-index: 9999;
    }

    .tool-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .tool-btn:hover {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .tool-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* ===== Home View ===== */
    .home-view {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 40px;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-2);
      max-width: 480px;
      line-height: 1.6;
    }

    /* ===== Tool Cards Grid ===== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 880px;
      width: 100%;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--card-accent, var(--primary));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .25s ease;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--card-accent, var(--primary));
    }

    .tool-card:hover::before {
      transform: scaleX(1);
    }

    .tool-card .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      background: var(--card-icon-bg, var(--primary-bg));
    }

    .tool-card .card-icon svg {
      width: 24px;
      height: 24px;
    }

    .tool-card h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .tool-card p {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
    }

    .tool-card .card-arrow {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--card-accent, var(--primary));
      transition: gap .2s ease;
    }

    .tool-card:hover .card-arrow {
      gap: 10px;
    }

    /* ===== Tool View (iframe) ===== */
    .tool-view {
      display: none;
      width: 100%;
      height: 100vh;
    }

    .tool-view.active {
      display: block;
    }

    .tool-view iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .toolbar { top: 8px; right: 8px; padding: 4px; gap: 2px; }
      .tool-btn { padding: 7px 10px; font-size: 13px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 14px; }
      .tools-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <button class="tool-btn active" data-view="home" onclick="showView('home')">首页</button>

  <script>
    function decodeB64(b64) {
      const bin = atob(b64.trim());
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    var loaded = {};

    // Preload all iframe contents on page load (eliminates lag from CDN resources like Tailwind)
    function preloadAll() {
      ['analysis', 'enhance', 'lyrics', 'editor'].forEach(function(view) {
        var iframe = document.querySelector('#view-' + view + ' iframe');
        var src = document.getElementById('src-' + view);
        if (src && iframe && !loaded[view]) {
          iframe.srcdoc = decodeB64(src.textContent);
          loaded[view] = true;
        }
      });
    }

    function showView(view) {
      document.querySelectorAll('.home-view, .tool-view').forEach(function(el) {
        el.classList.remove('active');
        el.style.display = 'none';
      });

      var target = document.getElementById('view-' + view);
      if (target) {
        if (view === 'home') {
          target.style.display = 'flex';
        } else {
          target.style.display = 'block';
          target.classList.add('active');
        }
      }

      document.querySelectorAll('.tool-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

      window.scrollTo(0, 0);
    }

    showView('home');
    // Preload all pages immediately so CDN resources start fetching right away
    preloadAll();
  </script>
